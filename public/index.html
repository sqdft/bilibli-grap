<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B站视频下载器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fb7299'/%3E%3Cpath d='M24 20l20 12-20 12z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▶</span> B站视频下载器</div>
    <div class="top-actions">
      <button id="clipToggle" class="chip" title="切回本窗口时，自动填入剪贴板中的B站链接并解析">📎 自动粘贴</button>
      <button id="historyBtn" class="chip" title="最近解析过的视频">🕘 历史</button>
      <button id="themeBtn" class="chip" title="切换深色/浅色/跟随系统">🌗 主题</button>
    </div>
  </header>

  <div id="historyPanel" class="panel hidden"></div>

  <main class="wrap">
    <!-- 搜索区 -->
    <section class="card search">
      <input id="videoUrl" type="text" placeholder="粘贴 B站 视频链接（支持 BV / av / b23.tv 短链），回车解析" />
      <button id="btnPaste" class="btn ghost" title="读取剪贴板中的链接">粘贴</button>
      <button id="btnInfo" class="btn primary">解析</button>
    </section>
    <div id="inputHint" class="hint hidden"></div>

    <!-- 视频信息卡 -->
    <section id="infoCard" class="card hidden">
      <div id="infoSkeleton" class="info-grid">
        <div class="cover-box"><div class="sk sk-cover"></div></div>
        <div class="meta">
          <div class="sk sk-line w70"></div>
          <div class="sk sk-line w45"></div>
          <div class="sk sk-line w30"></div>
        </div>
      </div>
      <div id="infoBody" class="info-grid hidden">
        <div class="cover-box"><img id="pic" class="cover" alt="封面" /></div>
        <div class="meta">
          <h2 id="title"></h2>
          <p class="sub"><span id="owner"></span> · <span id="views"></span> 播放 · <span id="likes"></span> 点赞</p>
          <p class="sub"><a id="videoLink" href="#" target="_blank" rel="noopener noreferrer">B站原页面 ↗</a></p>
          <div class="ctrl-row">
            <span class="ctrl-item"><label>画质</label><select id="qualitySelect"></select></span>
            <span class="ctrl-item"><label>分P</label><select id="pageSelect"></select></span>
          </div>
          <div class="action-row">
            <button id="btnPlay" class="btn primary">▶ 播放</button>
            <div class="dropdown" id="dlDropdown">
              <button id="btnDownload" class="btn primary">⬇ 下载 ▾</button>
              <div id="dlMenu" class="menu hidden"></div>
            </div>
            <button id="btnDanmaku" class="btn ghost small" title="下载全部弹幕并转为 ASS 字幕格式">弹幕 .ass</button>
            <button id="btnSubtitle" class="btn ghost small" title="下载AI字幕并转为 SRT">AI字幕 .srt</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 播放器 -->
    <section id="playerSection" class="card hidden">
      <video id="player" controls playsinline></video>
      <p id="segInfo" class="sub"></p>
    </section>

    <!-- 批量导入 -->
    <section class="card" id="batchCard">
      <div class="tabs">
        <button class="tab active" data-tab="links">多链接批量</button>
        <button class="tab" data-tab="space">收藏夹 / 合集 / UP主</button>
      </div>
      <div id="tab-links" class="tab-body">
        <textarea id="batchInput" rows="4" placeholder="每行一个 B站 视频链接 / BV号 / av号"></textarea>
        <div class="row">
          <button id="btnBatchParse" class="btn primary">解析列表</button>
          <span id="batchStat" class="sub"></span>
        </div>
      </div>
      <div id="tab-space" class="tab-body hidden">
        <input id="spaceInput" type="text" placeholder="粘贴 收藏夹 / 合集 / 系列 / UP主空间 链接" />
        <div class="row">
          <button id="btnSpaceFetch" class="btn primary">获取列表</button>
          <span id="spaceStat" class="sub"></span>
        </div>
      </div>
      <div id="pickList" class="pick-list hidden">
        <div class="pick-head">
          <label class="pick-all"><input type="checkbox" id="pickAll" /> 全选</label>
          <button id="btnPickDownload" class="btn primary small">⬇ 下载选中</button>
        </div>
        <div id="pickItems"></div>
      </div>
    </section>
  </main>

  <!-- 下载队列 -->
  <div id="queuePanel">
    <div class="queue-head">
      <span id="queueTitle">下载队列</span>
      <span class="queue-tools">
        <button id="queueClear" class="chip small">清空完成</button>
        <button id="queueToggle">▾</button>
      </span>
    </div>
    <div id="queueList" class="queue-list"></div>
  </div>

  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
